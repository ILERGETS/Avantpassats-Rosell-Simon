.lightbox {

      "es": "Portada del documento: «Biografía de Concepción Vilella y Gil». Concepción escribe sus memorias en Lleida el 4 de marzo de 1924, dirigidas a sus hijas. El documento es un testimonio autobiográfico de sus 67 años de vida.",
      "en": "Title page: «Biography of Concepció Vilella i Gil». Concepció writes her memoirs in Lleida on 4 March 1924, addressed to her daughters. The document is an autobiographical account of her 67 years of life.",
      "bg": "Заглавна страница: «Биография на Консепсио Вийела и Жил». Консепсио пише своите спомени в Лейда на 4 март 1924 г., адресирани до дъщерите си. Документът е автобиографично свидетелство за нейните 67 години живот."
    },
    "fidel": "Biografía de Concepción Vilella y Gil\n\nNací el día 28 de diciembre de 1856 en Lérida, en la calle Mayor n.º [il·legible], hija legítima de D. José Vilella y de Dª Francisca Gil, naturales de Lérida. Fui bautizada al día siguiente en la Iglesia de San Lorenzo de esta ciudad, siendo mis padrinos [il·legible].\n\nMi infancia transcurrió tranquila y feliz al lado de mis amantes padres; tuve varios hermanos aunque la mayor parte murieron de pequeños. Los que vivimos fuimos: [il·legible], Casildes y yo.",

    "traduccio_en": "Cover page: «Biography of Concepción Vilella and Gil». Written for her beloved daughters. Lleida, 4 March 1924.",
    "traduccio_bg": "Корица: «Биография на Консепсион Вийела и Хил». Написана за нейните скъпи дъщери. Лейда, 4 март 1924 г."

    "corregida_ca": "Vaig néixer el dia 28 de desembre de 1856 a Lleida, al carrer Major número [incert], filla legítima de don Jorge Vilella i de donya Joaquina Gil, naturals de Lleida. Em van batejar l'endemà a l'església de Sant Llorenç d'aquesta ciutat.\n\nLa meva infància va transcórrer tranquil·la i feliç al costat dels meus estimats pares. Vaig tenir diversos germans, encara que la majoria van morir de petits. Els que vam sobreviure vam ser: [Gil], Casilda i jo.\n\nLa meva mare va morir el 2 de febrer de 1858, quan jo tenia menys de 2 anys. El meu pare va morir quan jo tenia 5 anys. Ens va quedar la governanta Teresa Pujol.\n\nLa germana Casilda es va casar amb Josep Puig. El germà [Gil] va morir als 13 anys. La germana Candelaria estava casada [amb Joan Palmés].",
    "corregida_es": "Nací el día 28 de diciembre de 1856 en Lleida, en la calle Mayor número [incierto], hija legítima de don Jorge Vilella y de doña Joaquina Gil, naturales de Lleida. Me bautizaron al día siguiente en la iglesia de San Lorenzo de esta ciudad.\n\nMi infancia transcurrió tranquila y feliz junto a mis queridos padres. Tuve varios hermanos, aunque la mayoría murieron de pequeños. Los que sobrevivimos fuimos: [Gil], Casilda y yo.\n\nMi madre murió el 2 de febrero de 1858, cuando yo tenía menos de 2 años. Mi padre murió cuando yo tenía 5 años. Nos quedó la institutriz Teresa Pujol.\n\nLa hermana Casilda se casó con Josep Puig. El hermano [Gil] murió a los 13 años. La hermana Candelaria estaba casada [con Joan Palmés].",
    "traduccio_en": "I was born on 28 December 1856 in Lleida, on Mayor Street number [uncertain], legitimate daughter of don Jorge Vilella and doña Joaquina Gil, natives of Lleida. I was baptised the following day at the church of Sant Llorenç in this city.\n\nMy childhood passed peacefully and happily at the side of my beloved parents. I had several siblings, although most of them died young. Those who survived were: [Gil], Casilda, and I.\n\nMy mother died on 2 February 1858, when I was under 2 years old. My father died when I was 5 years old. Our governess Teresa Pujol stayed with us.\n\nMy sister Casilda married Josep Puig. My brother [Gil] died at the age of 13. My sister Candelaria was married [to Joan Palmés].",
    "traduccio_bg": "Родена съм на 28 декември 1856 г. в Лейда, на улица Майор № [неизвестен], законна дъщеря на дон Хорхе Вийела и доня Хоакина Хил, родом от Лейда. Кръстиха ме на следващия ден в църквата „Сан Лоренсо\" в този град.\n\nДетството ми премина спокойно и щастливо до моите скъпи родители. Имах няколко братя и сестри, но повечето починаха като малки. Тези от нас, които оцеляха, бяхме: [Хил], Касилда и аз.\n\nМайка ми почина на 2 февруари 1858 г., когато бях на по-малко от 2 години. Баща ми почина, когато бях на 5 години. При нас остана управителката Тереза Пухол.\n\nСестра ми Касилда се ожени за Жозеп Пуч. Братът [Хил] почина на 13 години. Сестра ми Канделариа беше омъжена [за Жоан Палмес]."

    "traduccio_en": "In 1885 the terrible cholera epidemic took place in Lleida. It was something horrifying: many people died every day and panic took hold of the population. We moved to Vilanova [i la Geltrú] to escape contagion.\n\nOur daughter [Condita/Conchita] contracted cholera, but Ignacito prayed to the Virgin and she survived. The whole family recovered. Many neighbours died, some buried near Montserrat.",
    "traduccio_bg": "През 1885 г. избухна страшната холерна епидемия в Лейда. Беше нещо ужасно: всеки ден умираха много хора и паниката обзе населението. Преместихме се в Виланова [и ла Желтру], за да избегнем заразяване.\n\nДъщеря ни [Кондита/Кончита] се зарази с холера, но Игнасито се помоли на Дева Мария и тя оцеля. Цялото семейство се възстанови. Много съседи починаха, някои погребани близо до Монсерат."

      "es": "Por culpa de obras en la calle, la familia cambia de piso. En tres semanas muere el hijo Javier (2 años) de sarampión. La hija Lurdes muere de difteria en casa de los Pérez. El 1 de mayo se trasladan al piso de la Playa, núm. 23, donde viven 9 años. En 1904, el marido cae gravemente enfermo el 11 de diciembre; la hija Conchita le acompaña constantemente; se recupera por intercesión de la Virgen del Carmen y vivirá 11 años más.",

    "fidel": "[Il·legible en gran part. Menciona germans i relacions familiars.]",
    "corregida_ca": "El dia 25 de març [de 1899?], a causa d'unes obres a la farmàcia del davant del cafè Puig, ens vam veure obligats a buscar pis. Ens vam traslladar al carrer Major, 3r pis. Al cap de tres setmanes, el fill Javier (2 anys) va morir de xarampió. Poc després, la filla Lurdes va morir a casa dels Pérez, de diftèria, contagiada de la filla d'aquesta família, que també va morir.\n\nL'1 de maig ens vam traslladar al pis de la Platja, núm. 23, 3r 1a, on vam habitar 9 anys.\n\nL'any 1904, el dia 11 de desembre, el meu estimat espòs va caure greument malalt. La seva malaltia va durar des del dia 11 de desembre fins al dia de la Verge del Carme [16 de juliol de 1905]: quasi tres mesos de fase crítica durant els quals la família va patir molt. La filla Conchita l'acompanyà en tot moment. La Verge del Carme, invocada durant la processó, li va retornar la vida i va viure 11 anys més [és a dir, fins al 1915–1917].\n\nPosteriorment ens vam traslladar al pis del carrer García Puigmolé, 12. L'any 1909 [incert: algun canvi important].",
    "corregida_es": "El día 25 de marzo [de 1899?], a causa de unas obras en la farmacia de enfrente del café Puig, nos vimos obligados a buscar piso. Nos trasladamos a la calle Mayor, 3.er piso. A las tres semanas, el hijo Javier (2 años) murió de sarampión. Poco después, la hija Lurdes murió en casa de los Pérez, de difteria, contagiada de la hija de esa familia, que también murió.\n\nEl 1 de mayo nos trasladamos al piso de la Playa, núm. 23, 3.er 1.ª, donde habitamos 9 años.\n\nEn el año 1904, el día 11 de diciembre, mi querido esposo cayó gravemente enfermo. Su enfermedad duró desde el día 11 de diciembre hasta el día de la Virgen del Carmen [16 de julio de 1905]: casi tres meses de fase crítica durante los cuales la familia sufrió mucho. La hija Conchita le acompañó en todo momento. La Virgen del Carmen, invocada durante la procesión, le devolvió la vida y vivió 11 años más.\n\nPosteriormente nos trasladamos al piso de la calle García Puigmolé, 12.",
    "traduccio_en": "On 25 March [1899?], due to works at the pharmacy opposite the Puig café, we were forced to find a new flat. We moved to Mayor Street, 3rd floor. Three weeks later, our son Javier (aged 2) died of measles. Shortly after, our daughter Lurdes died at the Pérez household, of diphtheria, caught from the daughter of that family, who also died.\n\nOn 1 May we moved to the flat at Platja Street, no. 23, 3rd floor 1st, where we lived for 9 years.\n\nIn 1904, on 11 December, my dear husband fell gravely ill. His illness lasted from 11 December until the feast of the Virgin of Carmen [16 July 1905]: almost three months of critical illness during which the family suffered greatly. Our daughter Conchita stayed at his side throughout. The Virgin of Carmen, invoked during the procession, restored his life and he lived 11 more years.\n\nWe later moved to the flat at García Puigmolé Street, no. 12.",
    "traduccio_bg": "На 25 март [1899?], поради строителни работи в аптеката срещу кафене Пуч, бяхме принудени да търсим апартамент. Преместихме се на улица Майор, 3-ти етаж. Три седмици по-късно синът ни Хавиер (на 2 г.) почина от морбили. Малко след това дъщеря ни Лурдес почина в дома на семейство Перес от дифтерия, заразена от дъщерята на това семейство, която също почина.\n\nНа 1 май се преместихме в апартамента на Пла¡а, № 23, 3-ти ет., 1-ви, където живяхме 9 години.\n\nПрез 1904 г., на 11 декември, скъпият ми съпруг се разболя тежко. Болестта му продължи от 11 декември до деня на Дева Мария Кармелска [16 юли 1905]: почти три месеца критично болен, по време на които семейството много страда. Дъщеря ни Кончита го придружаваше по всяко време. Дева Мария Кармелска, призована по време на шествието, му върна живота и той живя още 11 години.\n\nПо-късно се преместихме в апартамента на улица Гарсия Пуигмоле, № 12."

    "fidel": "[Il·legible en gran part. Menciona la salut del marit.]",
    "corregida_ca": "Sis mesos de convalescència. Vam pregar a la Verge de Lourdes, que li va retornar la salut. L'any següent [aprox. 1905–1906], vam repetir el viatge en companyia del meu espòs, de [Conchita?] i del fill [Josep Maria 2n?], que tenia aleshores 5 anys. Ens vam estar a [Gorjata?] i vam tornar a Lleida el dia 8 de novembre.\n\nAquell mateix any, un fill va tenir un problema al peu i el vam dur a Molins de Rei i Barcelona, on el metge doctor [Guillem?] el va operar. Tota la família ens vam instal·lar al [pis dels Pérez] mentre el fill es restablia; un altre fill tenia aleshores 3 anys. Vam quedar-nos fins a l'abril.\n\nVam celebrar el restabliment fent una excursió al Tibidabo. La germana Candelaria va venir a passar una temporada. Vam anar a banyar-nos i vam tornar tots a Lleida.",
    "corregida_es": "Seis meses de convalecencia. Rezamos a la Virgen de Lourdes, que le devolvió la salud. Al año siguiente [aprox. 1905–1906], repetimos el viaje en compañía de mi esposo, de [Conchita?] y del hijo [Josep Maria 2.º?], que tenía entonces 5 años. Estuvimos en [Gorjata?] y volvimos a Lleida el día 8 de noviembre.\n\nEse mismo año, un hijo tuvo un problema en el pie y lo llevamos a Molins de Rei y Barcelona, donde el médico doctor [Guillem?] lo operó. Toda la familia nos instalamos en [el piso de los Pérez] mientras el hijo se restablecía; otro hijo tenía entonces 3 años. Nos quedamos hasta abril.\n\nCelebramos el restablecimiento haciendo una excursión al Tibidabo. La hermana Candelaria vino a pasar una temporada. Fuimos a bañarnos y volvimos todos a Lleida.",
    "traduccio_en": "Six months of convalescence. We prayed to the Virgin of Lourdes, who restored his health. The following year [approx. 1905–1906], we repeated the trip in the company of my husband, [Conchita?] and our son [Josep Maria 2nd?], who was then 5 years old. We stayed in [Gorjata?] and returned to Lleida on 8 November.\n\nThat same year, a son had a problem with his foot and we took him to Molins de Rei and Barcelona, where doctor [Guillem?] operated on him. The whole family settled in [the Pérez flat] while the son recovered; another son was then 3 years old. We stayed until April.\n\nWe celebrated the recovery with a trip to the Tibidabo. Sister Candelaria came to stay for a while. We went bathing and all returned to Lleida.",
    "traduccio_bg": "Шест месеца на възстановяване. Молехме се на Дева Мария Лурдска, която му върна здравето. На следващата година [около 1905–1906 г.] повторихме пътуването в компанията на съпруга ми, [Кончита?] и сина [Жозеп Мария 2-ри?], който тогава беше на 5 години. Бяхме в [Горхата?] и се върнахме в Лейда на 8 ноември.\n\nСъщата година един от синовете ни имаше проблем с крака и го заведохме в Молинс де Рей и Барселона, където доктор [Гийем?] го оперира. Цялото семейство се настани в [апартамента на Перес], докато синът се възстановяваше; друг син беше на 3 години тогава. Останахме до април.\n\nОтпразнувахме оздравяването с екскурзия до Тибидабо. Сестра Канделариа дойде да прекара известно време. Ходихме да се къпем и всички се върнахме в Лейда."

      "es": "El esposo impulsa la instalación de una comunidad de 12 hermanas religiosas en Lleida. El 5 de julio de 1912, toda la familia asiste a la primera misa del sobrino Fernando Palomé. Visitan el Observatorio del Ebro, a cargo del sobrino Ignacio Pirás y Simón.",

    "fidel": "Con este objeto y (obteniendo el permiso) se entrevistó mi esposa [sic: mi esposo] con la Madre Secretaria en Barcelona y después de saber todas las gestiones y probar que ella era de los mismos directores General, y antes quedé enseñada a lo convenido.\n\nEl día de Nuestra [Señora] de la Recordación el año 1876, llegó la comunidad de 12 Hermanas y una dirección con instalación clara en el piso 1.º y 2.º de la calle de [il·legible]; donde permanecieron hasta el año [il·legible] en que residieron en la que era del albergue del Sr. Estanislao [il·legible] Villardons, y después del Sr. Estanislao Casas el que nombró el barón los [il·legible] mismo a mi esposo, se les consiguió lo que ahora están en la calle de los alrededores, que reúne mas buenas condiciones que hay posibles y es nuestra mas querida.\n\nEsta mujer García se hizo de este albergue ygo que les invistió [?] después de cumplir obras, permanecerán en obrar de concederle. Se les encargó la casa con toda la necesaria; 12 cuartos de tierra sin su pago mes, calderas y almacenes sin la ropa blanca como probando. Toda la necesaria para comer, vajilla y almas, y muebles del piso; regalando mi esposo a algunas chiflas [?] del mueble que ya que lo teníamos en tanto exceso como si fueran de la familia. De luego así mi esposo el día de los inauguración presenciado por el Sr. Obispo después de la bendición del local, Madre General y toda la comunidad, todos muy contentos y agradecidos a los bien buenos que yo di a sido preparando, habiendo encontrado la comunidad huéspedes de presentes que son 16 Hermanas y 2 directoras.\n\nEl día 5 de Julio de 1912 fuimos toda la familia, las de mis hermanas, y Gabriela y Margarita de Toledo para visitar la primera misa de mi sobrino e hijo de [il·legible] Fernando Palomo [il·legible] el que había ingresado en la capellanía de [il·legible] en cuanto lo acompañó mi esposo 45 [años] antes. La celebró en la Iglesia de [il·legible] junto con 12 capellanes más, todos muy sati     "corregida_es": "El esposo gestionó la instalación de una comunidad de 12 hermanas religiosas en Lleida [en un piso de la calle…]. Permanecieron allí hasta que se encontró un local mejor, con muy buenas condiciones.\n\nEl día 5 de julio de 1912, toda la familia fue a celebrar la primera misa del sobrino Fernando Palomé [o Palomo?], que se había ordenado sacerdote. La ceremonia tuvo lugar en la iglesia de [incierto], con 12 sacerdotes. Visitaron el Observatorio del Ebro, a cargo del sobrino Ignacio Pirás y Simón [sobrino del esposo].",
    "traduccio_en": "The husband arranged the installation of a community of 12 religious sisters in Lleida [in a flat on the street…]. They remained there until a better premises was found, with very good conditions.\n\nOn 5 July 1912, the whole family attended the first mass of nephew Fernando Palomé [or Palomo?], who had been ordained a priest. The ceremony took place at the church of [uncertain], with 12 priests. They visited the Ebro Observatory, run by nephew Ignacio Pirás y Simón [the husband's nephew].",
    "traduccio_bg": "Съпругът уреди настаняването на общност от 12 монахини в Лейда [в апартамент на улицата…]. Те останаха там, докато не се намери по-добро помещение с много добри условия.\n\nНа 5 юли 1912 г. цялото семейство присъства на първата литургия на племенника Фернандо Паломе [или Паломо?], ръкоположен за свещеник. Церемонията се проведе в църквата на [неизвестно], с 12 свещеници. Посетиха Обсерваторията на Ебро, ръководена от племенника Игнасио Пирас и Симон [племенник на съпруга]."

    "corregida_ca": "Poc temps després de la mort de l'espòs [febrer de 1917], es va concedir el casament de la filla Montserrat amb el Dr. [il·legible] Janin, a casa de la germana Casilda, que es va oferir per celebrar-ho a la seva casa, ja que el dol rigorós era incompatible amb una celebració a la pròpia llar.\n\nL'espòs dels Janin i la seva mare van venir a demanar la mà. Finalment, el 9 de maig de 1921, es va celebrar el matrimoni a la Capella de la Mansió. Van venir els fills de Barcelona, els pares i les famílies dels Janin. Els nuvis van marxar de viatge a Montserrat [el monestir] i Barcelona.\n\nEl dia 22 de gener va morir la germana Casilda.\n\n(Nota: l'arbre genealògic identifica el marit de Montserrat com a Josep Maria Sanuy Ramonich; el dietari el denomina «Dr. Janin». Cal verificar si es tracta de la mateixa persona o d'una incongruència.)",

    "traduccio_bg": "Малко след смъртта на съпруга [февруари 1917 г.] беше договорена сватбата на дъщерята Монсерат с д-р [нечетливо] Янин, в дома на сестра Касилда, която предложи дома си за тържеството, тъй като строгият траур беше несъвместим с празнуване в собствения им дом.\n\nСъпругът на семейство Янин и майка му дойдоха да поискат ръката й. Накрая, на 9 май 1921 г., бракът беше сключен в параклиса Мансио. Дойдоха децата от Барселона, родителите и семействата на Янин. Младоженците заминаха на пътуване до Монсерат [манастира] и Барселона.\n\nНа 22 януари умря сестра Касилда.\n\n(Забележка: семейното дърво идентифицира съпруга на Монсерат като Жозеп Мария Сануи Рамоник; дневникът го нарича «д-р Янин». Очаква се проверка.)"

    traduccio_hidden: 'La traducción no está disponible en castellano.',
    pagina: 'Página',
    de: 'de',
    anterior: 'Anterior',
    seguent: 'Siguiente',
    img_alt: 'Página del diario',
    img_no: 'Imagen no disponible',
  },
  en: {
    resum: 'Summary',
    fidel: 'Faithful transcription',
    corregida: 'Corrected transcription',
    traduccio: 'Translation',
    fidel_label: 'Faithful transcription — original 20th-c. Spanish',
    corregida_label: 'Corrected transcription — Catalan',
    traduccio_label: 'English translation',
    traduccio_hidden: '',
    pagina: 'Page',
    de: 'of',
    anterior: 'Previous',
    seguent: 'Next',
    img_alt: 'Diary page',
    img_no: 'Image not available',
  },
  bg: {
    resum: 'Резюме',
    fidel: 'Точна транскрипция',
    corregida: 'Поправена транскрипция',
    traduccio: 'Превод',
    fidel_label: 'Точна транскрипция — оригинален испански XX в.',
    corregida_label: 'Поправена транскрипция — каталонски',
    traduccio_label: 'Превод на български',
    traduccio_hidden: '',
    pagina: 'Страница',
    de: 'от',
    anterior: '← Предишна',
    seguent: 'Следваща →',
    img_alt: 'Страница от дневника',
    img_no: 'Изображението не е налично',
  },
};

// ── ESTAT ──
let currentPage = 0;  // índex 0-based
let currentLang = 'ca';
let currentTab = 'resum';

// ── FUNCIÓ PRINCIPAL D'ACTUALITZACIÓ ──
function render() {
  const p = PAGES[currentPage];
  const ui = UI[currentLang];
  const n = currentPage;

  // Imatge
  const img = document.getElementById('page-img');
  const placeholder = document.getElementById('img-placeholder');
  img.style.display = '';
  placeholder.style.display = 'none';
  img.src = p.img;
  img.alt = ui.img_alt + ' ' + (currentPage+1);
  document.getElementById('img-placeholder-text').textContent = ui.img_no;

  // Indicador de pàgina
  document.getElementById('page-num-disp').textContent = p.num;
  document.getElementById('page-indicator').innerHTML =
    ui.pagina + ' <span class="page-num">' + p.num + '</span> ' + ui.de + ' 25';

  // Botons nav
  document.getElementById('btn-prev').disabled = currentPage === 0;
  document.getElementById('btn-next').disabled = currentPage === PAGES.length - 1;
  document.getElementById('prev-label').textContent = ui.anterior;
  document.getElementById('next-label').textContent = ui.seguent;

  // Etiquetes tabs
  document.getElementById('tab-resum').textContent = ui.resum;
  document.getElementById('tab-fidel').textContent = ui.fidel;
  document.getElementById('tab-corregida').textContent = ui.corregida;
  document.getElementById('tab-traduccio').textContent = ui.traduccio;

  // ─ TAB: RESUM ─
  document.getElementById('label-resum').textContent = ui.resum;
  let resumText = '';
  if (currentLang === 'ca') resumText = p.resum.ca;
  else if (currentLang === 'es') resumText = p.resum.es;
  else if (currentLang === 'en') resumText = p.resum.en;
  else if (currentLang === 'bg') resumText = p.resum.bg;
  document.getElementById('text-resum').textContent = resumText;

  // ─ TAB: FIDEL ─
  document.getElementById('label-fidel').textContent = ui.fidel_label;
  document.getElementById('text-fidel').textContent = p.fidel;

  // ─ TAB: CORREGIDA ─
  document.getElementById('label-corregida').textContent = ui.corregida_label;
  let corregidaText = '';
  if (currentLang === 'es') corregidaText = p.corregida_es;
  else corregidaText = p.corregida_ca;
  document.getElementById('text-corregida').textContent = corregidaText;

  // ─ TAB: TRADUCCIÓ ─
  document.getElementById('label-traduccio').textContent = ui.traduccio_label;
  const tradWrap = document.getElementById('text-traduccio-wrap');
  let tradHtml = '';
  if (currentLang === 'en') {
    // Mostra únicament la traducció anglesa
    tradHtml = p.traduccio_en
      ? '<div class="traduccio-text">' + escapeHtml(p.traduccio_en) + '</div>'
      : '<div class="traduccio-hidden">No English translation available.</div>';
  } else if (currentLang === 'bg') {
    // Mostra únicament la traducció búlgara
    tradHtml = p.traduccio_bg
      ? '<div class="traduccio-text">' + escapeHtml(p.traduccio_bg) + '</div>'
      : '<div class="traduccio-hidden">Няма налична Bulgarian превод.</div>';
  } else {
    // CA / ES: mostra les dues traduccions disponibles amb etiqueta
    if (p.traduccio_en) {
      tradHtml += '<div class="trad-section"><span class="trad-lang-label">English</span><div class="traduccio-text">' + escapeHtml(p.traduccio_en) + '</div></div>';
    }
    if (p.traduccio_bg) {
      tradHtml += '<div class="trad-section"><span class="trad-lang-label">Български</span><div class="traduccio-text">' + escapeHtml(p.traduccio_bg) + '</div></div>';
    }
    if (!tradHtml) tradHtml = '<div class="traduccio-hidden">Cap traducció disponible.</div>';
  }
  tradWrap.innerHTML = tradHtml;

  // Thumb nav
  document.querySelectorAll('.thumb-btn').forEach((btn, i) => {
    btn.classList.toggle('current', i === currentPage);
  });
  // Scroll thumb a vista
  const currentThumb = document.querySelector('.thumb-btn.current');
  if (currentThumb) currentThumb.scrollIntoView({block:'nearest', inline:'center'});
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

// ── CONTROLS ──
function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  render();
  try { localStorage.setItem('dietari-lang', lang); } catch(e) {}
}

function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('hidden', !c.id.endsWith(tab)));
  try { localStorage.setItem('dietari-tab', tab); } catch(e) {}
}

function navigate(dir) {
  const next = currentPage + dir;
  if (next >= 0 && next < PAGES.length) {
    currentPage = next;
    render();
    try { localStorage.setItem('dietari-page', currentPage); } catch(e) {}
    window.scrollTo(0, 0);
    document.querySelectorAll('.tab-content').forEach(c => { c.scrollTop = 0; });
  }
}

function goToPage(idx) {
  currentPage = idx;
  render();
  try { localStorage.setItem('dietari-page', currentPage); } catch(e) {}
}

// ── LIGHTBOX ──
function openLightbox() {
  const p = PAGES[currentPage];
  const lb = document.getElementById('lightbox');
  document.getElementById('lightbox-img').src = p.img;
  document.getElementById('lb-info').textContent = 'Pàgina ' + p.num + ' de 25  ·  Esc per tancar';
  document.getElementById('lb-prev').disabled = currentPage === 0;
  document.getElementById('lb-next').disabled = currentPage === PAGES.length - 1;
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(e) {
  if (e && e.target && e.target.id === 'lightbox-img') return;
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
function lightboxNav(dir, e) {
  e.stopPropagation();
  const next = currentPage + dir;
  if (next >= 0 && next < PAGES.length) {
    navigate(dir);
    const p = PAGES[currentPage];
    document.getElementById('lightbox-img').src = p.img;
    document.getElementById('lb-info').textContent = 'Pàgina ' + p.num + ' de 25  ·  Esc per tancar';
    document.getElementById('lb-prev').disabled = currentPage === 0;
    document.getElementById('lb-next').disabled = currentPage === PAGES.length - 1;
  }
}

// ── NAVEGACIÓ PER TECLAT ──
document.addEventListener('keydown', e => {
  const lbOpen = document.getElementById('lightbox').classList.contains('open');
  if (e.key === 'Escape') { if (lbOpen) closeLightbox(null); return; }
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    if (lbOpen) lightboxNav(1, {stopPropagation:()=>{}});
    else navigate(1);
  }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    if (lbOpen) lightboxNav(-1, {stopPropagation:()=>{}});
    else navigate(-1);
  }
});

// ── CREAR THUMB NAV ──
(function buildThumbNav() {
  const nav = document.createElement('div');
  nav.className = 'thumb-nav';
  PAGES.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'thumb-btn';
    btn.title = 'Pàgina ' + p.num;
    btn.textContent = p.num;
    btn.onclick = () => goToPage(i);
    nav.appendChild(btn);
  });
  const footer = document.querySelector('footer');
  const indicator = footer.querySelector('.page-indicator');
  footer.insertBefore(nav, indicator);
})();

// ── INIT ──
(function init() {
  try {
    const savedPage = parseInt(localStorage.getItem('dietari-page') || '0');
    const savedLang = localStorage.getItem('dietari-lang') || 'ca';
    const savedTab  = localStorage.getItem('dietari-tab')  || 'resum';
    currentPage = Math.max(0, Math.min(PAGES.length-1, savedPage || 0));
    currentLang = ['ca','es','en','bg'].includes(savedLang) ? savedLang : 'ca';
    currentTab  = ['resum','fidel','corregida','traduccio'].includes(savedTab) ? savedTab : 'resum';
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
    setTab(currentTab);
  } catch(e) {
    currentPage = 0; currentLang = 'ca'; currentTab = 'resum';
  }
  render();
})();
</script>
